
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venta de productos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background-color: #f4f7fb;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #0b1f3a;
        }

        .productos {
            max-width: 1000px;
            margin: 30px auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .tarjeta {
            width: 250px;
            padding: 20px;
            box-sizing: border-box;
            background-color: white;
            border: 1px solid #d9e2ec;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .tarjeta h2 {
            color: #0b1f3a;
            font-size: 20px;
        }

        .precio {
            color: #007a50;
            font-size: 22px;
            font-weight: bold;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            background-color: #00a8e8;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #087eaf;
        }

        #mensaje {
            text-align: center;
            margin-top: 25px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .tarjeta {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <h1>Venta de productos</h1>

    <div class="productos">

        <div class="tarjeta">
            <h2>Laptop</h2>
            <p>Equipo portátil para trabajo y estudio.</p>
            <p class="precio">S/ 2,500.00</p>
            <button type="button" onclick="comprar('Laptop')">
                Comprar
            </button>
        </div>

        <div class="tarjeta">
            <h2>Teclado</h2>
            <p>Teclado para computadora.</p>
            <p class="precio">S/ 80.00</p>
            <button type="button" onclick="comprar('Teclado')">
                Comprar
            </button>
        </div>

        <div class="tarjeta">
            <h2>Mouse</h2>
            <p>Mouse para computadora.</p>
            <p class="precio">S/ 45.00</p>
            <button type="button" onclick="comprar('Mouse')">
                Comprar
            </button>
        </div>

    </div>

    <p id="mensaje">Selecciona un producto.</p>

    <script>
        function comprar(producto) {
            document.getElementById("mensaje").textContent =
                "Has seleccionado: " + producto;
        }
    </script>
</body>
</html>
