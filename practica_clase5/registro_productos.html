
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de productos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b1f3a;
            margin: 0;
            padding: 30px;
        }

        .contenedor {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #0b1f3a;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #cccccc;
            border-radius: 5px;
        }

        .botones {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .registrar {
            background-color: #00a8e8;
            color: white;
        }

        .limpiar {
            background-color: #e0e0e0;
            color: #333333;
        }
    </style>
</head>

<body>
    <div class="contenedor">
        <h1>Registro de productos</h1>

        <form id="formularioProductos">
            <label for="producto">Nombre del producto:</label>
            <input type="text" id="producto" name="producto" required>

            <label for="stock">Stock:</label>
            <input type="number" id="stock" name="stock" min="0" required>

            <label for="proveedor">Proveedor:</label>
            <input type="text" id="proveedor" name="proveedor" required>

            <label for="correo">Correo del proveedor:</label>
            <input type="email" id="correo" name="correo" required>

            <label for="fecha">Fecha de registro:</label>
            <input type="date" id="fecha" name="fecha" required>

            <div class="botones">
                <button type="submit" class="registrar">Registrar</button>
                <button type="reset" class="limpiar">Limpiar</button>
            </div>
        </form>
    </div>

    <script>
        const formulario = document.getElementById("formularioProductos");

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();
            alert("Formulario validado correctamente.");
        });
    </script>
</body>
</html>
